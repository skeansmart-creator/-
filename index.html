<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>調解會議排程系統</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">勞資爭議調解</p>
        <h1>會議排程管理</h1>
      </div>
      <div class="header-actions">
        <button id="exportCsv" class="secondary-button" type="button">匯出報表</button>
        <button id="exportWeeklyReport" class="secondary-button" type="button">產出週報表</button>
        <button id="newCase" class="primary-button" type="button">新增排程</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="toolbar" aria-label="查詢工具">

        <label>
          關鍵字
          <input id="keyword" type="search" placeholder="案號、當事人、調解人" />
        </label>
        <label>
          狀態
          <select id="statusFilter">
            <option value="all">全部</option>
            <option value="scheduled">已排定</option>
            <option value="changed">改期</option>
            <option value="withdrawn">撤回</option>
            <option value="cancelled">取消</option>
            <option value="finished">完成</option>
          </select>
        </label>
      </section>

      <section class="intake-panel">
        <div class="panel-title">
          <div>
            <h2>待排案件</h2>
            <p id="intakeSummary">尚未匯入收案資料，請點「匯入收案 Excel」</p>
          </div>
          <input id="intakeExcelInput" type="file" accept=".xlsx,.xls" style="display:none" />
          <button id="importIntakeBtn" class="secondary-button" type="button">匯入收案 Excel</button>
        </div>
        <div id="intakeList" class="intake-list"></div>
      </section>

      <section class="stats" aria-label="統計摘要">
        <article>
          <span id="totalCount">0</span>
          <p>本週會議</p>
        </article>
        <article>
          <span id="roomCount">0</span>
          <p>使用會議室</p>
        </article>
        <article>
          <span id="changedCount">0</span>
          <p>改期/取消/撤回</p>
        </article>
        <article>
          <span id="mediatorCount">0</span>
          <p>調解人</p>
        </article>
      </section>

      <section style="max-width:1480px;margin:18px auto 0;">
        <div class="calendar-panel">
          <div class="panel-title" style="flex-wrap:wrap;gap:10px;">
            <h2>週排程</h2>
            <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
              <button id="prevWeek" type="button" class="icon-button" title="上一週" style="font-size:18px;">«</button>
              <input id="weekPicker" type="week" style="min-height:36px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;" />
              <button id="nextWeek" type="button" class="icon-button" title="下一週" style="font-size:18px;">»</button>
              <button id="todayWeek" type="button" class="secondary-button" style="min-height:36px;font-size:13px;padding:0 10px;">本週</button>
            </div>
            <p id="weekRange" style="width:100%;margin:0;padding:0 2px;"></p>
          </div>
          <div id="calendar" class="calendar" aria-label="週排程表"></div>
        </div>
      </section>

      <section style="max-width:1480px;margin:18px auto 0;">
        <div class="side-panel" style="width:100%;">
          <div class="panel-title">
            <h2>案件清單</h2>
            <p>點選案件可編輯</p>
          </div>
          <div id="caseList" class="case-list" style="max-height:320px;"></div>
        </div>
      </section>
    </main>

    <dialog id="caseDialog">
      <form id="caseForm" method="dialog">
        <div class="dialog-head">
          <h2 id="dialogTitle">新增排程</h2>
          <button id="closeDialog" class="icon-button" type="button" aria-label="關閉">×</button>
        </div>

        <input id="caseId" type="hidden" />
        <input id="sourceCaseNo" type="hidden" />
        <input id="workerGender" type="hidden" />
        <input id="workerAge" type="hidden" />
        <input id="maleCount" type="hidden" value="0" />
        <input id="femaleCount" type="hidden" value="0" />
        <input id="mediationMethodCode" type="hidden" />

        <div style="margin-bottom:14px;">
          <label style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;">
            <span>從 Excel 匯入排程資料</span>
            <input id="importExcel" type="file" accept=".xlsx,.xls" style="display:none" />
            <button type="button" class="secondary-button" style="min-height:32px;font-size:13px;"
              onclick="document.getElementById('importExcel').click()">選擇 Excel 檔案</button>
            <span id="importFileName" style="font-weight:400;color:var(--muted)"></span>
          </label>
        </div>

        <div class="form-grid">
          <label>
            案號
            <input id="caseNo" required />
          </label>
          <label>
            日期
            <input id="meetingDate" type="date" required />
          </label>
          <label>
            時間
            <input id="meetingTime" type="time" required />
          </label>
          <label>
            會議室
            <select id="room" required>
              <option>晤談室(一)</option>
              <option>晤談室(二)</option>
              <option>晤談室(三)</option>
              <option>晤談室(四)</option>
              <option>勞資爭議調解會議室</option>
              <option>其他</option>
            </select>
          </label>
          <label id="roomOtherLabel" hidden>
            其他地點
            <input id="roomOther" />
          </label>
          <label>
            勞方
            <input id="worker" required />
          </label>
          <label>
            資方
            <input id="employer" required />
          </label>
          <label>
            調解人
            <input id="mediator" required />
          </label>
          <label>
            承辦人
            <input id="owner" required />
          </label>
          <label>
            紀錄
            <input id="recorder" />
          </label>
          <label>
            爭議類型
            <select id="disputeType">
              <option>工資</option>
              <option>休息日工資</option>
              <option>例假</option>
              <option>特別休假</option>
              <option>產假及產假工資</option>
              <option>加班費</option>
              <option>資遣費</option>
              <option>舊制退休金</option>
              <option>回復工作權</option>
              <option>回復原職務</option>
              <option>服務證書</option>
              <option>非自願離職證明書</option>
              <option>其他</option>
              <option>預告期間工資</option>
              <option>勞退新制提繳(6%)</option>
              <option>勞工保險給付爭議</option>
              <option>契約</option>
              <option>工會身分保護</option>
              <option>職業災害補償-醫療費用</option>
              <option>職業災害補償-原領工資</option>
              <option>職業災害補償-失能補償</option>
              <option>職業災害補償-死亡補償</option>
              <option>職業災害補償-喪葬費</option>
              <option>國定假日</option>
            </select>
          </label>
          <label>
            調解方式
            <select id="reportCategory">
              <option value="A">A - 台中市勞資關係協會</option>
              <option value="B">B - 臺中市（縣）勞資關係協會</option>
              <option value="E">E - 台中市勞雇關係協會</option>
              <option value="J">J - 臺中市職業災害法律服務協會</option>
              <option value="H">H - 指派調解人</option>
              <option value="F">F - 調解委員會</option>
              <option value="AH">AH - 指派調解人(台中市勞資關係協會)</option>
              <option value="BH">BH - 指派調解人(臺中市（縣）勞資關係協會)</option>
              <option value="EH">EH - 指派調解人(台中市勞雇關係協會)</option>
              <option value="JH">JH - 指派調解人(臺中市職業災害法律服務協會)</option>
            </select>
          </label>
          <label style="flex-direction:row!important;align-items:center;gap:16px;">
            特殊案件
            <span style="display:inline-flex;align-items:center;gap:14px;font-weight:400;">
              <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--text);margin:0;">
                <input type="radio" name="specialCase" id="special_yes" value="是" onchange="syncSpecialCaseType()"> 是
              </label>
              <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--text);margin:0;">
                <input type="radio" name="specialCase" id="special_no" value="否" checked onchange="syncSpecialCaseType()"> 否
              </label>
            </span>
            <input id="specialCaseType" type="hidden" value="無" />
          </label>
          <label>
            狀態
            <select id="caseStatus">
              <option value="scheduled">已排定</option>
              <option value="changed">改期</option>
              <option value="withdrawn">撤回</option>
              <option value="cancelled">取消</option>
              <option value="finished">完成</option>
            </select>
          </label>
          <label class="full">
            備註
            <textarea id="notes" rows="3"></textarea>
          </label>
        </div>

        <div id="conflictWarning" class="warning" hidden></div>
        <div class="dialog-actions">
          <button id="deleteCase" class="danger-button" type="button">刪除</button>
          <span></span>
          <button class="secondary-button" id="cancelEdit" type="button">取消</button>
          <button class="primary-button" type="submit">儲存</button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js?v=20260519m"></script>
  </body>
</html>
